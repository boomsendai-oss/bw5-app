# リールの他SNS横展開 (YouTube Shorts / X / Threads / Facebook / TikTok) cron
# 毎日 JST 20:00 = UTC 11:00 に1回。Instagram公開済み(reel_queue.status='posted')の
# リールを1件だけ二次配信する。
#
# 20:00 なのは、リール本体の投稿(19:00 JST / instagram-reel-cron.yml)が
# 確実に終わってから走らせるため。
#
# **1回の実行で1件だけ**処理する。配信先の数だけ実行が要るので、
# YouTube / X / Threads / Facebook / TikTok の5つになった今は**1日5回**回す
# (新しいリールが翌日までに全部出そろうようにするため)。
#
# 回数を増やしてもXの無料枠は超えない。/initialize + /append + /finalize が
# 24時間で計17リクエストしかなく30MB級の動画1本で約11使う = 実質1日1本だが、
# route側で「直近24時間にX投稿が成功していたらXを対象から外す」ようにしてある。
# 枠の管理はcronの回数ではなくコードが持つので、配信先が増えても回数を足せる。
#
# env未設定のプラットフォームは route 側で skipped になるだけで、失敗にはならない。
# 後から env が入れば pending へ戻る (classifyByEnabled)。
name: crosspost-reel-cron

on:
  schedule:
    # 20:17 / 21:37 / 22:47 / 翌0:07 / 翌7:27 JST。
    # GH Actionsは0/20/40分に大遅延するため、空いている分を使う。
    - cron: '17 11 * * *'
    - cron: '37 12 * * *'
    - cron: '47 13 * * *'
    - cron: '7 15 * * *'
    - cron: '27 22 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call /api/cron/crosspost-reel
        run: |
          set -e
          RESP=$(curl -s -w '\n%{http_code}' -X POST \
            --max-time 600 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/crosspost-reel)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE (期待:200)"; exit 1; }
          # ⚠️ HTTPコードだけでは配信失敗を検知できない。route側の fail() は
          # 失敗時も **status 200** のまま {"ok":false,"platform":"x","error":"..."} を返すため、
          # 200だけを見ていると永久に緑になる(2026-08-10からのX全滅を5日間見逃した)。
          # 正常系は必ず ok:true (配信対象なし・別プロセス処理中も ok:true)。
          #   成功        : {"ok":true,"posted":true,...}
          #   対象なし    : {"ok":true,"posted":false,"note":"配信対象なし"} など
          #   失敗(要対応): {"ok":false,...}
          echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1 \
            || { echo "::error::二次配信に失敗しました (ok != true): $BODY"; exit 1; }
