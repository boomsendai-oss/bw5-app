# インスタリール 予約自動投稿cron
# 毎日 JST 19:00 = UTC 10:00 に発火。reel_queue の期限が来た scheduled を1件公開する。
# 19-20時 = boom_sendaiフォロワーのオンライン活動ピーク帯(2026-07実測)。
# キュー投入はClaude(制作)→TAROが /staff/instagram で確認・キャンセル。
# サーバー側で完結するため、Mac/Claudeアプリの起動状態に依存しない(2026-07-17の未発火事故の恒久対策)。
name: instagram-reel-cron

on:
  schedule:
    # 19:00 JST目標。GH Actionsは毎時0/20/40分など人気の分に大遅延する(実測60-90分)ため、
    # 空いている分(52/12/32)に設定。claimによる冪等ガードでリトライ2本は安全。
    - cron: '52 9 * * *'
    - cron: '12 10 * * *'
    - cron: '32 10 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/cron/post-reel
        run: |
          set -e
          RESP=$(curl -s -w '\n%{http_code}' -X POST \
            --max-time 300 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/post-reel)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || exit 1
