# インスタストーリーズ 日次自動投稿cron
# 毎朝 JST 8:00 に発火 = UTC 23:00(前日)。
# 8時=全曜日レッスン前(最早レッスン=土10:00)＋フォロワー朝の活動ピーク帯。
# 「今日のレッスン」告知を朝に出すことで一日中正確・場面の面を取る。
# 投稿対象は public/stories/{曜日}.mp4 がある曜日のみ(火曜=レッスン無し→動画なし→自動スキップ)。
name: instagram-story-cron

# ⚠️2026-09-10: 発火役は Cloudflare Workers(boom-cron)が一次になった。
# ここに残しているscheduleは「Cloudflare側が1週間安定するまでの予備」であり、
# 2026-09-17頃に schedule ブロックごと削除する予定(workflow_dispatch は手動用に残す)。
# 削除の判断材料は STATE.md のWS「インスタ自動投稿」行。
#
# 🔴21:00枠ぶんのcron(UTC 12:03/12:23)は2026-09-10に削除した。理由は「遅れるから効かない」
# ではなく「遅れると積極的に害になる」ため: GH Actionsの遅延+4h20mでJST日付をまたいで
# 翌01:2x に発火し、post-story の朝の素材は時刻ガードを持たない(その日まだ投稿していなければ
# 出す)ので、翌日の朝ストーリーが深夜1時台に出てしまっていた(9/9=01:27・9/10=01:24の実害)。
# 21:00枠はCloudflare側が定刻に撃つので予備は不要。

on:
  schedule:
    # 8:00 JST目標。GH Actionsは毎時0/20/40分など人気の分に大遅延する(実測60-90分)ため、
    # 空いている分(52/12/32)に設定。冪等ガードがあるのでリトライ2本は安全。
    # 遅れても同じJST日のうちに収まる(実測 9:22〜10:22)ので、Cloudflareが先に出した後の
    # 二度打ちは冪等に吸収される=予備として無害。
    - cron: '52 22 * * *'
    - cron: '12 23 * * *'
    - cron: '32 23 * * *'
    # JST 18:33/18:43 (夕方枠用・2026-08-21追加)。夕方に出したい告知(ワークショップ等)を
    # 21時まで待たずに出す。枠が無い日はendpointが何もしない(冪等)ので毎日叩いて安全。
    - cron: '33 9 * * *'
    - cron: '43 9 * * *'
    # JST 12:02/12:12 (12:00枠用・2026-08-21追加)。正午指定の枠をMac非依存で正時直後に拾う。
    # 枠が無い日はendpointが何もしない(冪等)ので毎日叩いて安全。
    - cron: '02 3 * * *'
    - cron: '12 3 * * *'
    # JST 12:33 (昼の枠用)。UI標準の12:30枠が、従来は次の実行=21時までずれて出ていた
    - cron: '33 3 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/post-story
        run: |
          set -e
          RESP=$(curl -s --max-time 60 -w '\n%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/post-story)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE (期待:200)"; exit 1; }
          # 本文も見る。投稿対象が無い日・投稿済み(冪等)は {"ok":true,"posted":false,...} = 正常。
          echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1 \
            || { echo "::error::ストーリー投稿に失敗しました: $BODY"; exit 1; }
