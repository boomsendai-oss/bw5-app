# 「今週のレッスン」X投稿生成cron (2026-07-17 / 2026-09-05改)
# 毎週月曜 07:00 JST (日曜 22:00 UTC) に /api/cron/x-weekly-schedule-draft を叩く(予備: 08:30 JST)。
# 公開Googleカレンダー(BOOMレッスンスケジュール=予定の正)から当週分を読み、
# 月曜午前中の生成ならその場でXへ投稿する(層0=承認不要)。GH Actionsのcron遅延で
# 「8:00予約→投稿cron待ち→猶予切れ」になるのを避けるため、日曜夜の事前生成はやめた。
name: x-weekly-schedule

on:
  schedule:
    - cron: '0 22 * * 0'
    - cron: '30 23 * * 0'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/x-weekly-schedule-draft
        run: |
          set -e
          RESP=$(curl -s -w '\n%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/x-weekly-schedule-draft)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE (期待:200)"; exit 1; }
          # 何もしなかった正常系は ok:true (skipped=no-lessons / already-exists)。
          # ok:false は Google未連携 / レッスンカレンダー消失 = 下書きが静かに止まる本当の異常。
          echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1 \
            || { echo "::error::今週のレッスン下書きを生成できませんでした: $BODY"; exit 1; }
