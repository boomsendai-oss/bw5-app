# 入会特典Tシャツの該当者さがし(毎日)
# 毎日 JST 7:23 = UTC 22:23(前日)。請求記録の毎日の取り込み(深夜2時ごろ)の後。混雑する00分を避ける。
# 11/1以降に特典つきで月謝プラン入会した会員を台帳 gift_tshirt_claims に足すだけ。
# お客さんへの送信(公式LINEの案内)はしない。
# 台帳のマイグレーションが本番に未適用の間は skipped=table_missing で返る(警告だけ・赤にしない)。
name: gift-tshirt-scan
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/gift-tshirt-scan
        run: |
          set -e
          RESP=$(curl -s --max-time 60 -w '\n%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/gift-tshirt-scan)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE (期待:200)"; exit 1; }
          echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1 \
            || { echo "::error::該当者さがしに失敗しました: $BODY"; exit 1; }
          echo "$BODY" | jq -r 'if .skipped == "table_missing" then "::warning::台帳テーブル gift_tshirt_claims が本番に未作成です(マイグレーション未適用)" else empty end'
          echo "$BODY" | jq -r 'if (.unlinked // 0) > 0 then "::warning::会員と紐付いていない該当請求が \(.unlinked) 件あります(台帳に入れられません)" else empty end'
