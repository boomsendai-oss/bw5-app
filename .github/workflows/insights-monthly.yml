# リール月次サマリー
# 毎月1日 JST 9:00 = UTC 0:00。リール成績サマリーをTAROへメール(データ無しの月は自動スキップ)。
name: insights-monthly
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/insights-monthly
        run: |
          set -e
          RESP=$(curl -s --max-time 60 -w '\n%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/insights-monthly)
          echo "HTTP $(echo "$RESP" | tail -1): $(echo "$RESP" | sed '$d')"
          [ "$(echo "$RESP" | tail -1)" = "200" ] || exit 1
