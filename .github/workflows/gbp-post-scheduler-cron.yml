# GBP月次予約投稿の自動登録 (2026-07-25)
# クラウドルーティン(毎月20日9:00 JST)が boom-events-hub に翌月分ドラフトを生成した後、
# /api/cron/gbp-post-scheduler が v4 localPosts へ scheduledTime 付きで予約投稿を作成する。
# 冪等なので複数回叩いて安全。
#   1回目: 20日 10:30 JST (ルーティン完了後の通常実行)
#   2回目: 20日 18:00 JST (final=1: ドラフト未生成ならTAROへ通知して人間にバトン)
name: gbp-post-scheduler-cron

on:
  schedule:
    - cron: '30 1 20 * *' # 20日 10:30 JST
    - cron: '0 9 20 * *' # 20日 18:00 JST (final)
  workflow_dispatch:
    inputs:
      month:
        description: '対象月 YYYY-MM (省略時はJST翌月)'
        required: false
        default: ''
      dry:
        description: 'dry run (1=作成せず計画のみ)'
        required: false
        default: ''

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/gbp-post-scheduler
        run: |
          set -e
          QS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then QS="${QS}&month=${{ github.event.inputs.month }}"; fi
          if [ "${{ github.event.inputs.dry }}" = "1" ]; then QS="${QS}&dry=1"; fi
          # 18:00 JST(9:00 UTC)のスケジュール実行はその月の最終試行
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" -ge 5 ]; then QS="${QS}&final=1"; fi
          RESP=$(curl -s -w '\n%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://bw5-app.vercel.app/api/cron/gbp-post-scheduler?_=1${QS}")
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || exit 1
          echo "$BODY" | grep -q '"ok":true' || exit 1
