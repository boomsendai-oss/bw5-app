# 「本日のレッスン」自動投稿の生成cron (2026-08-07・層0=承認不要)
# 毎日12:00 JST(03:00 UTC)に当日分を生成し12:30 JST予約でx_posts(approved)+threads_posts(リンク)へ投入。
# レッスンが無い日・カレンダー未連携時は何もしない(安全)。
name: x-daily-schedule

on:
  schedule:
    # 12:00 JST が本命。GitHubのcronはこのリポで数時間遅れるため 13:30 JST にも予備発火する
    # (同日分は already-exists で二重生成されない)。生成時刻が10:30〜20:30ならルート側がその場で投稿する
    - cron: '0 3 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/x-daily-schedule
        run: |
          set -e
          RESP=$(curl -s -w '\n%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/x-daily-schedule)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE (期待:200)"; exit 1; }
          # 何もしなかった正常系は ok:true (skipped=no-lessons / already-exists / dormant)。
          # ok:false はレッスンカレンダーが見つからない時だけ = 生成が静かに止まる本当の異常。
          echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1 \
            || { echo "::error::本日のレッスン投稿を生成できませんでした: $BODY"; exit 1; }
