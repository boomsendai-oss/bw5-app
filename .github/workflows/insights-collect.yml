# 投稿インサイト自動収集
# 毎日 JST 4:00 = UTC 19:00。リール(投稿後30日)とストーリー(投稿後3日)の
# リーチ/再生/保存などを1日1スナップショット貯める。
# 目的=「一定期間運用してデータを見て再計画」を人手の目視に頼らないための土台。
# Vercel Hobby cron枠(2/2使用済)を消費しないためGH Actions側に置く。
name: insights-collect

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/collect-insights
        run: |
          set -e
          RESP=$(curl -s --max-time 60 -w '\n%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://bw5-app.vercel.app/api/cron/collect-insights)
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP $CODE: $BODY"
          [ "$CODE" = "200" ] || { echo "::error::HTTP $CODE (期待:200)"; exit 1; }
          # ⚠️ route側は収集エラーがあっても 200 を返し ok:false に落とすだけなので本文も見る。
          # 正常 = {"ok":true,...,"errors":[]} / env未設定 = {"ok":true,"configured":false,...}
          echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1 \
            || { echo "::error::インサイト収集に失敗があります: $BODY"; exit 1; }
